<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenCAA Book Studio - Accessible Engine</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Comic+Neue:wght@400;700&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- Parser NLP per l'Italiano -->
  <script src="https://unpkg.com/it-compromise"></script>

  <style>
    @font-face {
      font-family: 'OpenDyslexic';
      src: url('https://cdn.jsdelivr.net/gh/antijoin/opendyslexic@master/fonts/OpenDyslexic-Regular.otf') format('opentype');
    }

    :root {
      --fitz-people: #FFFDE7; --fitz-people-border: #FBC02D;
      --fitz-action: #E8F5E9; --fitz-action-border: #388E3C;
      --fitz-object: #FFF3E0; --fitz-object-border: #F57C00;
      --fitz-descriptor: #E3F2FD; --fitz-descriptor-border: #1976D2;
      --fitz-social: #FCE4EC; --fitz-social-border: #C2185B;
      --fitz-misc: #FAFAFA;   --fitz-misc-border: #9E9E9E;

      --ui-bg: #EAECEE;
      --primary: #005A9E;
      
      --doc-font-family: 'Atkinson Hyperlegible', sans-serif;
      --doc-font-size: 1.1rem;
      --doc-text-color: #212121;
      --doc-alignment: left;
      --symbol-size: 75px;
      --token-width: 105px;
      --token-height: 130px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Atkinson Hyperlegible', sans-serif;
      background-color: var(--ui-bg);
      color: #333;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    button:focus-visible, select:focus-visible, input:focus-visible, [contenteditable="true"]:focus-visible {
      outline: 3px solid var(--primary);
      outline-offset: 2px;
    }

    /* TOOLBAR */
    .ribbon {
      background: #FFFFFF;
      border-bottom: 1px solid #D1D5DB;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      z-index: 100;
    }

    .ribbon-top {
      background: var(--primary);
      color: white;
      padding: 6px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ribbon-top h1 { 
      font-size: 0.95rem; 
      font-weight: 700; 
      display: flex; 
      align-items: center; 
      gap: 8px; 
    }

    .ribbon-controls {
      display: flex;
      flex-wrap: wrap;
      padding: 8px 16px;
      gap: 12px;
      background: #F8F9FA;
      align-items: center;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-right: 12px;
      border-right: 1px solid #E0E0E0;
    }

    .control-group label {
      font-size: 0.75rem;
      font-weight: 700;
      color: #333333;
      text-transform: uppercase;
    }

    select, input[type="color"], button {
      font-family: inherit;
      font-size: 0.85rem;
      padding: 5px 8px;
      border-radius: 4px;
      border: 1px solid #767676;
      background: white;
      cursor: pointer;
    }

    button { 
      font-weight: 600; 
      display: inline-flex; 
      align-items: center; 
      gap: 6px; 
    }
    
    button:hover { background: #EAEAEA; }
    
    .btn-action { 
      background: #2E7D32; 
      color: white; 
      border-color: #1B5E20; 
    }
    
    .btn-action:hover { background: #1B5E20; }

    .btn-icon {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* WORKSPACE */
    .studio-workspace {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .pages-sidebar {
      width: 200px;
      background: #FFFFFF;
      border-right: 1px solid #D1D5DB;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 10px;
      background: #F3F4F6;
      border-bottom: 1px solid #E5E7EB;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-header h2 { font-size: 0.8rem; text-transform: uppercase; color: #333333; }

    .pages-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .page-thumbnail {
      border: 2px solid #E5E7EB;
      border-radius: 4px;
      padding: 8px;
      background: #FAFAFA;
      cursor: pointer;
      text-align: center;
    }

    .page-thumbnail.active { border-color: var(--primary); background: #EFF6FF; }

    .editor-container {
      flex: 1;
      overflow-y: auto;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 30px;
    }

    .book-page {
      background: white;
      padding: 50px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      box-sizing: border-box;
      outline: none;
      overflow-y: auto;
      text-align: var(--doc-alignment);
      font-family: var(--doc-font-family);
      font-size: var(--doc-font-size);
      color: var(--doc-text-color);
      line-height: 1.8;
      transition: width 0.2s ease, height 0.2s ease;
    }

    /* Formati pagina */
    .book-page.format-a4-portrait {
      width: 800px;
      height: 1050px;
    }

    .book-page.format-a4-landscape {
      width: 1050px;
      height: 800px;
    }

    .book-page.format-a5-portrait {
      width: 580px;
      height: 820px;
    }

    .book-page.format-a3-landscape {
      width: 1200px;
      height: 850px;
    }

    /* TESSERA CAA */
    .caa-token {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      width: var(--token-width);
      height: var(--token-height);
      padding: 4px;
      border-radius: 6px;
      border: 2px solid var(--fitz-misc-border);
      background-color: var(--fitz-misc);
      user-select: none;
      box-sizing: border-box;
      vertical-align: bottom;
      margin: 2px 4px;
      cursor: pointer;
      contenteditable: false;
    }

    .symbol-box {
      width: 100%;
      height: var(--symbol-size);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .symbol-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
    
    .symbol-loader {
      width: 22px;
      height: 22px;
      border: 3px solid #E0E0E0;
      border-top: 3px solid var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .symbol-placeholder { 
      width: 20px; 
      height: 20px; 
      border: 2px dashed #BDBDBD; 
      border-radius: 50%; 
    }

    .token-text {
      font-family: var(--doc-font-family);
      font-size: var(--doc-font-size);
      color: var(--doc-text-color);
      font-weight: 700;
      text-align: center;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }

    /* Schema Cromatico Fitzgerald Key */
    .fitz-people     { background-color: var(--fitz-people);     border-color: var(--fitz-people-border); }
    .fitz-action     { background-color: var(--fitz-action);     border-color: var(--fitz-action-border); }
    .fitz-object     { background-color: var(--fitz-object);     border-color: var(--fitz-object-border); }
    .fitz-descriptor { background-color: var(--fitz-descriptor); border-color: var(--fitz-descriptor-border); }
    .fitz-social     { background-color: var(--fitz-social);     border-color: var(--fitz-social-border); }
    .fitz-misc       { background-color: var(--fitz-misc);       border-color: var(--fitz-misc-border); }

    .hide-symbols .symbol-box { display: none; }
    .hide-symbols .caa-token { height: auto; border: none; background: transparent; width: auto; padding: 2px; }

    /* REGOLE DI STAMPA PDF MIGLIORATE */
    @media print {
      html, body {
        background: white !important;
        height: auto !important;
        overflow: visible !important;
      }
      
      .ribbon, .pages-sidebar { 
        display: none !important; 
      }

      .studio-workspace, .editor-container { 
        display: block !important; 
        overflow: visible !important; 
        padding: 0 !important; 
        margin: 0 !important; 
        height: auto !important;
      }

      .book-page { 
        box-shadow: none !important; 
        width: 100% !important; 
        padding: 15mm !important; 
        height: auto !important; 
        min-height: 280mm !important;
        overflow: visible !important;
        page-break-after: always !important;
        break-after: page !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        display: block !important;
      }

      .book-page:last-child {
        page-break-after: auto !important;
        break-after: auto !important;
      }

      .caa-token {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      @page {
        size: A4 portrait;
        margin: 0;
      }
    }
  </style>
</head>
<body>

  <!-- TOOLBAR -->
  <header class="ribbon">
    <div class="ribbon-top">
      <h1>
        <svg class="btn-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
        OpenCAA Book Studio
      </h1>
      <span>Editor CAA Accessibile (WCAG 2.2 compliant)</span>
    </div>
    
    <div class="ribbon-controls" role="toolbar" aria-label="Strumenti di formattazione ed editing">
      <div class="control-group">
        <label for="page-format-select">Formato Pagina</label>
        <select id="page-format-select" onchange="changePageFormat(this.value)">
          <option value="format-a4-portrait" selected>A4 Verticale</option>
          <option value="format-a4-landscape">A4 Orizzontale</option>
          <option value="format-a5-portrait">A5 Tascabile</option>
          <option value="format-a3-landscape">A3 Tabellone</option>
        </select>
      </div>

      <div class="control-group">
        <label for="font-family-select">Font</label>
        <select id="font-family-select" onchange="updateFontStyle()">
          <option value="'Atkinson Hyperlegible', sans-serif">Atkinson (Leggibile)</option>
          <option value="'OpenDyslexic', sans-serif">OpenDyslexic (Dislessia)</option>
          <option value="'Comic Neue', cursive">Comic Neue (Infanzia)</option>
          <option value="'Open Sans', sans-serif">Open Sans (Standard)</option>
        </select>
        
        <select id="font-size-select" onchange="updateFontStyle()" aria-label="Dimensione carattere">
          <option value="0.9rem">Piccolo</option>
          <option value="1.1rem" selected>Medio</option>
          <option value="1.4rem">Grande</option>
        </select>

        <input type="color" id="text-color-picker" value="#212121" onchange="updateFontStyle()" title="Colore Testo" aria-label="Colore del testo">
      </div>

      <div class="control-group">
        <label>Allinea</label>
        <button onclick="setAlignment('left')" aria-label="Allinea a sinistra">
          <svg class="btn-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M15 15H3v2h12v-2zm0-8H3v2h12V7zM3 13h18v-2H3v2zm0 8h18v-2H3v2zM3 3v2h18V3H3z"/></svg>
        </button>
        <button onclick="setAlignment('center')" aria-label="Allinea al centro">
          <svg class="btn-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M7 15v2h10v-2H7zm-4-8v2h18V7H3zm2 6h14v-2H5v2zm-2 8h18v-2H3v2zM7 3v2h10V3H7z"/></svg>
        </button>
        <button onclick="setAlignment('right')" aria-label="Allinea a destra">
          <svg class="btn-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 21h18v-2H3v2zm6-4h12v-2H9v2zm-6-4h18v-2H3v2zm6-4h12V7H9v2zM3 3v2h18V3H3z"/></svg>
        </button>
      </div>

      <div class="control-group">
        <label for="symbol-size-select">Simboli</label>
        <select id="symbol-size-select" onchange="updateSymbolSize()">
          <option value="small">Piccoli</option>
          <option value="medium" selected>Medi</option>
          <option value="large">Grandi</option>
        </select>
        <button id="toggle-symbols-btn" onclick="toggleSymbols()">
          <svg class="btn-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
          Mostra/Nascondi
        </button>
      </div>

      <div class="control-group" style="border-right:none;">
        <button class="btn-action" onclick="readPage()">
          <svg class="btn-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          Leggi Pagina
        </button>
        <button onclick="triggerPDFPrint()">
          <svg class="btn-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-4 11H9v-5h6v5zm4-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-2-9H7v4h10V3z"/></svg>
          Stampa PDF
        </button>
      </div>
    </div>
  </header>

  <!-- WORKSPACE -->
  <div class="studio-workspace">
    <nav class="pages-sidebar" aria-label="Gestione Pagine">
      <div class="sidebar-header">
        <h2>Pagine Libro</h2>
        <button onclick="addNewPage()" aria-label="Aggiungi una nuova pagina">+ Aggiungi</button>
      </div>
      <div class="pages-list" id="pages-list" role="list"></div>
    </nav>

    <main class="editor-container">
      <div class="book-page format-a4-portrait" id="active-book-page" contenteditable="true" spellcheck="false" role="textbox" aria-multiline="true" aria-label="Area di composizione testo e simboli CAA"></div>
    </main>
  </div>

  <script>
    let bookState = {
      pages: [{ id: 1, html: '', format: 'format-a4-portrait' }],
      currentPageIndex: 0,
      showSymbols: true
    };

    const PRONOUNS = ["io", "tu", "lui", "lei", "noi", "voi", "loro", "chi", "te", "mi", "ti", "ci", "vi", "gli", "le"];
    const ARTICLES = ["il", "lo", "la", "i", "gli", "le", "un", "uno", "una", "questo", "quello", "quest", "quell", "mia", "mio", "miei", "mie", "tuo", "tua", "suo", "sua"];
    const PREPOSITIONS = ["a", "di", "da", "in", "con", "su", "per", "tra", "fra"];

    const COMPOUND_PREPOSITIONS = {
      "del": "di", "dello": "di", "della": "di", "degli": "di", "delle": "di",
      "al": "a", "allo": "a", "alla": "a", "agli": "a", "alle": "a",
      "dal": "da", "dallo": "da", "dalla": "da", "dagli": "da", "dalle": "da",
      "nel": "in", "nello": "in", "nella": "in", "negli": "in", "nelle": "in",
      "sul": "su", "sullo": "su", "sulla": "su", "sugli": "su", "sulle": "su",
      "col": "con", "coi": "con"
    };

    const LOGICAL_CONNECTIVES = {
      "perché": "perché", "perche": "perché", "ma": "ma", "però": "pero",
      "se": "se", "cioè": "cioe", "quindi": "quindi", "poi": "poi", "mentre": "mentre", "e": "e", "o": "o", "che": "che"
    };

    const VERB_LEMMA_MAP = {
      "voglio": "volere", "vuoi": "volere", "vuole": "volere", "vogliamo": "volere", "vogliono": "volere",
      "posso": "potere", "puoi": "potere", "può": "potere", "possiamo": "potere", "possono": "potere",
      "devo": "dovere", "devi": "dovere", "deve": "dovere", "dobbiamo": "dovere", "devono": "dovere",
      "so": "sapere", "sai": "sapere", "sa": "sapere", "sappiamo": "sapere", "sanno": "sapere",
      "salgo": "salire", "sali": "salire", "sale": "salire", "saliamo": "salire", "salgono": "salire",
      "mangio": "mangiare", "mangi": "mangiare", "mangia": "mangiare", "mangiamo": "mangiare", "mangiano": "mangiare",
      "vado": "andare", "vai": "andare", "va": "andare", "andiamo": "andare", "vanno": "andare",
      "ho": "avere", "hai": "avere", "ha": "avere", "abbiamo": "avere", "hanno": "avere", "avevo": "avere",
      "faccio": "fare", "fai": "fare", "fa": "fare", "facciamo": "fare", "fanno": "fare",
      "detto": "dire", "dico": "dire", "dice": "dire", "diciamo": "dire", "dicono": "dire", "dicevo": "dire",
      "iniziavo": "iniziare", "inizio": "iniziare", "inizia": "iniziare", "iniziamo": "iniziare", "iniziano": "iniziare",
      "provare": "provare", "provo": "provare", "prova": "provare", "provavo": "provare",
      "sento": "sentire", "senti": "sentire", "sente": "sentire", "sentivo": "sentire",
      "pesca": "pescare", "pesco": "pescare", "peschi": "pescare", "peschiamo": "pescare", "pescano": "pescare"
    };

    const FITZGERALD_FALLBACK = {
      people: ["io", "tu", "lui", "lei", "noi", "voi", "loro", "mamma", "papà", "maestra", "bambino", "te", "gli", "mia", "amica", "amico"],
      action: ["vado", "andare", "mangio", "mangiare", "piace", "pescare", "volere", "potere", "dovere", "ho", "avere", "detto", "dire", "iniziavo", "iniziare", "provare"],
      object: ["casa", "scuola", "mela", "palla", "acqua", "pane", "libro", "bici", "cane", "gatto", "qualcosa", "pesca"],
      descriptor: ["mia", "mio", "bello", "grande", "piccolo"]
    };

    const symbolCache = new Map();
    let activeBookPage = document.getElementById('active-book-page');
    const pagesList = document.getElementById('pages-list');

    window.onload = () => {
      renderSidebarPages();
      loadPage(0);
      initEditorEvents();
    };

    function changePageFormat(selectedFormat) {
      if (activeBookPage) {
        activeBookPage.classList.remove('format-a4-portrait', 'format-a4-landscape', 'format-a5-portrait', 'format-a3-landscape');
        activeBookPage.classList.add(selectedFormat);
      }
      bookState.pages[bookState.currentPageIndex].format = selectedFormat;
    }

    function renderSidebarPages() {
      pagesList.innerHTML = '';
      bookState.pages.forEach((page, index) => {
        const thumb = document.createElement('button');
        thumb.className = `page-thumbnail ${index === bookState.currentPageIndex ? 'active' : ''}`;
        thumb.setAttribute('role', 'listitem');
        thumb.setAttribute('aria-label', `Vai a pagina ${index + 1}`);
        thumb.onclick = () => switchPage(index);
        thumb.innerHTML = `<span style="font-size:0.75rem; font-weight:bold;">Pagina ${index + 1}</span>`;
        pagesList.appendChild(thumb);
      });
    }

    function addNewPage() {
      saveCurrentPageDOM();
      const newPageIndex = bookState.pages.length;
      const currentFormat = document.getElementById('page-format-select').value;
      bookState.pages.push({ id: newPageIndex + 1, html: '', format: currentFormat });
      renderSidebarPages();
      switchPage(newPageIndex);
    }

    function switchPage(index) {
      saveCurrentPageDOM();
      bookState.currentPageIndex = index;
      renderSidebarPages();
      loadPage(index);
    }

    function saveCurrentPageDOM() {
      if (activeBookPage) {
        bookState.pages[bookState.currentPageIndex].html = activeBookPage.innerHTML;
      }
    }

    function loadPage(index) {
      const pageData = bookState.pages[index];
      if (activeBookPage) {
        activeBookPage.innerHTML = pageData.html || '';
        const format = pageData.format || 'format-a4-portrait';
        document.getElementById('page-format-select').value = format;
        changePageFormat(format);
        activeBookPage.focus();
      }
    }

    function getSingularLemma(word) {
      if (word.length <= 3) return word;
      if (word.endsWith('avo') || word.endsWith('avi') || word.endsWith('ava')) return word;
      if (word.endsWith('i')) return word.slice(0, -1) + 'o';
      if (word.endsWith('e')) return word.slice(0, -1) + 'a';
      return word;
    }

    function analyzeContextWithNLP(word, fullSentenceContext) {
      const cleanWord = word.toLowerCase().trim();
      let searchQuery = cleanWord;
      let category = 'misc';

      // Estrai la parola precedente nel contesto per rilevare articoli o preposizioni
      let prevWord = "";
      if (fullSentenceContext) {
        const words = fullSentenceContext.trim().split(/\s+/);
        const idx = words.map(w => w.toLowerCase().replace(/[\?!\.,;:]/g, '')).lastIndexOf(cleanWord);
        if (idx > 0) {
          prevWord = words[idx - 1].toLowerCase().replace(/[\?!\.,;:]/g, '');
        }
      }

      // Regole basate sul contesto sintattico (es. "a pesca" vs "una pesca" vs "lui pesca")
      if (ARTICLES.includes(prevWord) || COMPOUND_PREPOSITIONS[prevWord] || prevWord === "a") {
        if (cleanWord === "pesca") {
          return { searchQuery: "pesca", category: 'object' };
        }
      }

      if (PRONOUNS.includes(cleanWord) || ["mia", "mio", "miei", "mie"].includes(cleanWord)) {
        return { searchQuery: cleanWord, category: 'people' };
      }

      if (LOGICAL_CONNECTIVES[cleanWord]) {
        return { searchQuery: LOGICAL_CONNECTIVES[cleanWord], category: 'misc' };
      }

      if (COMPOUND_PREPOSITIONS[cleanWord]) {
        return { searchQuery: COMPOUND_PREPOSITIONS[cleanWord], category: 'misc' };
      }

      if (VERB_LEMMA_MAP[cleanWord]) {
        return { searchQuery: VERB_LEMMA_MAP[cleanWord], category: 'action' };
      }

      // Analisi NLP dinamica con it-compromise se disponibile
      if (window.nlp) {
        try {
          const doc = window.nlp(cleanWord);
          if (doc.verbs().found) {
            return { searchQuery: doc.verbs().toInfinitive().text() || cleanWord, category: 'action' };
          }
          if (doc.nouns().found) {
            return { searchQuery: getSingularLemma(cleanWord), category: 'object' };
          }
        } catch (e) {
          console.warn("NLP Parse error:", e);
        }
      }

      searchQuery = getSingularLemma(cleanWord);

      for (const [cat, list] of Object.entries(FITZGERALD_FALLBACK)) {
        if (list.includes(cleanWord)) {
          category = cat;
          break;
        }
      }

      return { searchQuery, category };
    }

    function initEditorEvents() {
      if (!activeBookPage) return;

      activeBookPage.addEventListener('keydown', async (e) => {
        if (e.key === ' ' || e.code === 'Space' || e.key === 'Enter') {
          const selection = window.getSelection();
          if (!selection.rangeCount) return;

          const range = selection.getRangeAt(0);
          const node = range.startContainer;

          if (node.nodeType === Node.TEXT_NODE) {
            const textBeforeCursor = node.textContent.substring(0, range.startOffset);
            const match = textBeforeCursor.match(/(\S+)\s*$/);

            if (match) {
              e.preventDefault();
              const fullToken = match[1];

              const cleanWordMatch = fullToken.match(/^([a-zA-ZàèéìòùA-ZÀÈÉÌÒÙ0-9]+)([\?!\.,;:]*)$/);
              let word = fullToken;
              let punctuation = '';

              if (cleanWordMatch) {
                word = cleanWordMatch[1];
                punctuation = cleanWordMatch[2];
              }

              const fullSentenceText = node.parentNode.textContent || word;

              const matchIndex = textBeforeCursor.lastIndexOf(fullToken);
              const newTextBefore = textBeforeCursor.substring(0, matchIndex);
              node.textContent = newTextBefore + node.textContent.substring(range.startOffset);

              range.setStart(node, newTextBefore.length);
              range.collapse(true);

              let lastInsertedNode = null;

              if (word.length > 0) {
                const tokenNode = await createTokenNode(word, fullSentenceText);
                range.insertNode(tokenNode);
                lastInsertedNode = tokenNode;
              }

              if (punctuation.length > 0) {
                const punctNode = await createTokenNode(punctuation, punctuation);
                if (lastInsertedNode) {
                  lastInsertedNode.after(punctNode);
                } else {
                  range.insertNode(punctNode);
                }
                lastInsertedNode = punctNode;
              }

              const afterSpaceNode = document.createTextNode(e.key === 'Enter' ? '\n' : '\u00A0');
              if (lastInsertedNode) {
                lastInsertedNode.after(afterSpaceNode);
              } else {
                range.insertNode(afterSpaceNode);
              }

              const newRange = document.createRange();
              newRange.setStartAfter(afterSpaceNode);
              newRange.collapse(true);
              selection.removeAllRanges();
              selection.addRange(newRange);
            }
          }
        }
      });

      activeBookPage.addEventListener('paste', async (e) => {
        e.preventDefault();
        const pastedText = (e.clipboardData || window.clipboardData).getData('text');
        if (!pastedText.trim()) return;

        const selection = window.getSelection();
        if (!selection.rangeCount) return;
        const range = selection.getRangeAt(0);

        const tokens = pastedText.match(/[\wàèéìòùA-ZÀÈÉÌÒÙ0-9]+|[\?!\.,;:]+|\s+/g);
        if (!tokens) return;

        const fragment = document.createDocumentFragment();

        for (let token of tokens) {
          if (/^\s+$/.test(token)) {
            fragment.appendChild(document.createTextNode(token.includes('\n') ? '\n' : '\u00A0'));
          } else if (/^[\?!\.,;:]+$/.test(token)) {
            const punctNode = await createTokenNode(token, token);
            fragment.appendChild(punctNode);
          } else {
            const tokenNode = await createTokenNode(token, pastedText);
            fragment.appendChild(tokenNode);
          }
        }

        range.deleteContents();
        range.insertNode(fragment);
        range.collapse(false);
        selection.removeAllRanges();
        selection.addRange(range);
      });

      activeBookPage.addEventListener('click', (e) => {
        const token = e.target.closest('.caa-token');
        if (token) {
          const text = token.querySelector('.token-text').textContent;
          speakWord(text);
        }
      });
    }

    async function createTokenNode(word, contextText = "") {
      const { searchQuery, category } = analyzeContextWithNLP(word, contextText);

      const tokenEl = document.createElement('span');
      tokenEl.className = `caa-token fitz-${category}`;
      tokenEl.setAttribute('contenteditable', 'false');
      tokenEl.setAttribute('tabindex', '0');
      tokenEl.setAttribute('role', 'button');
      tokenEl.setAttribute('aria-label', `Tessera CAA: ${word}`);

      tokenEl.innerHTML = `
        <span class="symbol-box">
          <span class="symbol-loader"></span>
        </span>
        <span class="token-text">${word}</span>
      `;

      fetchSymbolImage(searchQuery, tokenEl.querySelector('.symbol-box'), word);
      return tokenEl;
    }

    async function fetchSymbolImage(searchQuery, containerEl, originalWord = "") {
      const cacheKey = `${searchQuery}_${originalWord}`;
      if (symbolCache.has(cacheKey)) {
        containerEl.innerHTML = `<img src="${symbolCache.get(cacheKey)}" alt="${originalWord || searchQuery}" />`;
        return;
      }

      let url = await searchArasaac(searchQuery);

      if (!url && searchQuery !== searchQuery.toLowerCase()) {
        url = await searchArasaac(searchQuery.toLowerCase());
      }

      if (!url && originalWord && originalWord !== searchQuery) {
        url = await searchArasaac(originalWord.toLowerCase());
      }

      if (url) {
        symbolCache.set(cacheKey, url);
        containerEl.innerHTML = `<img src="${url}" alt="${originalWord || searchQuery}" />`;
      } else {
        containerEl.innerHTML = `<span class="symbol-placeholder"></span>`;
      }
    }

    async function searchArasaac(query) {
      try {
        const res = await fetch(`https://api.arasaac.org/api/pictograms/it/search/${encodeURIComponent(query)}`);
        if (res.ok) {
          const data = await res.json();
          if (data && data.length > 0) {
            const symbolId = data[0]._id;
            return `https://static.arasaac.org/pictograms/${symbolId}/${symbolId}_300.png`;
          }
        }
      } catch (err) {
        console.warn("ARASAAC Fetch Error:", err);
      }
      return null;
    }

    function updateFontStyle() {
      const font = document.getElementById('font-family-select').value;
      const size = document.getElementById('font-size-select').value;
      const color = document.getElementById('text-color-picker').value;

      document.documentElement.style.setProperty('--doc-font-family', font);
      document.documentElement.style.setProperty('--doc-text-color', color);
      document.documentElement.style.setProperty('--doc-font-size', size);
    }

    function setAlignment(align) {
      document.documentElement.style.setProperty('--doc-alignment', align);
    }

    function updateSymbolSize() {
      const size = document.getElementById('symbol-size-select').value;
      if (size === 'small') {
        document.documentElement.style.setProperty('--symbol-size', '45px');
        document.documentElement.style.setProperty('--token-width', '80px');
        document.documentElement.style.setProperty('--token-height', '90px');
      } else if (size === 'medium') {
        document.documentElement.style.setProperty('--symbol-size', '75px');
        document.documentElement.style.setProperty('--token-width', '105px');
        document.documentElement.style.setProperty('--token-height', '130px');
      } else if (size === 'large') {
        document.documentElement.style.setProperty('--symbol-size', '100px');
        document.documentElement.style.setProperty('--token-width', '130px');
        document.documentElement.style.setProperty('--token-height', '160px');
      }
    }

    function toggleSymbols() {
      bookState.showSymbols = !bookState.showSymbols;
      const btn = document.getElementById('toggle-symbols-btn');
      if (bookState.showSymbols) {
        if (activeBookPage) activeBookPage.classList.remove('hide-symbols');
        btn.style.backgroundColor = 'white';
      } else {
        if (activeBookPage) activeBookPage.classList.add('hide-symbols');
        btn.style.backgroundColor = '#E3F2FD';
      }
    }

    function speakWord(text) {
      if ('speechSynthesis' in window) {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'it-IT';
        window.speechSynthesis.speak(u);
      }
    }

    function readPage() {
      if (!activeBookPage) return;
      const tokens = activeBookPage.querySelectorAll('.token-text');
      const text = Array.from(tokens).map(t => t.textContent).join(' ');
      if (text) speakWord(text);
    }

    /* GESTIONE STAMPA PDF ASINCRONA */
    function prepareDocForPrint() {
      saveCurrentPageDOM();

      const container = document.querySelector('.editor-container');
      container.innerHTML = '';

      bookState.pages.forEach((pageData, idx) => {
        const pageEl = document.createElement('div');
        pageEl.className = `book-page ${pageData.format || 'format-a4-portrait'}`;
        if (!bookState.showSymbols) pageEl.classList.add('hide-symbols');
        pageEl.innerHTML = pageData.html || '';
        container.appendChild(pageEl);
      });

      // Forza il reflow del DOM da parte del browser prima della stampa
      void container.offsetHeight;
    }

    function restoreDocAfterPrint() {
      const container = document.querySelector('.editor-container');
      container.innerHTML = `<div class="book-page ${bookState.pages[bookState.currentPageIndex].format}" id="active-book-page" contenteditable="true" spellcheck="false" role="textbox" aria-multiline="true" aria-label="Area di composizione testo e simboli CAA"></div>`;
      
      activeBookPage = document.getElementById('active-book-page');
      loadPage(bookState.currentPageIndex);
      initEditorEvents();
    }

    function triggerPDFPrint() {
      prepareDocForPrint();
      setTimeout(() => {
        window.print();
      }, 100);
    }

    window.onafterprint = restoreDocAfterPrint;
  </script>
</body>
